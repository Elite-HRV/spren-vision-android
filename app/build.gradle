plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace = "com.spren.spren"
    
    compileSdk 35

    defaultConfig {
        applicationId "com.spren.spren"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

//    implementation("com.spren:sprencore:2.3.0-SNAPSHOT")
    implementation("com.spren:sprencore:2.0.8")
//    implementation("com.spren:sprencapture:2.3.0-SNAPSHOT")
    implementation("com.spren:sprencapture:2.0.9")
//    implementation("com.spren:sprenui:2.3.1-SNAPSHOT")
    implementation("com.spren:sprenui:2.0.3")
}